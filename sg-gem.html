<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gem SG - Crystal Dive</title>
<style>
body{font-family:Arial;padding:16px;background:#0f172a;color:#fff;max-width:480px;margin:auto}
.card{background:#1e293b;padding:16px;border-radius:12px;margin-top:12px}
label{display:block;margin-top:12px}
input{width:100%;padding:12px;margin-top:6px;border-radius:8px;border:none;font-size:16px}
button{width:100%;padding:14px;margin-top:16px;background:#22c55e;color:#fff;border:none;border-radius:10px;font-size:18px;font-weight:bold}
.result{background:#0ea5e9;padding:14px;border-radius:10px;margin-top:14px;font-size:17px;display:none}
a{color:#38bdf8}
</style>
</head>
<body>
<h1>💎 Gem SG</h1>
<p>Loose Stone Only - No Metal</p>
<p><a href="index.html">← Back to Home</a></p>
<div class="card">
<label>Weight in Air (g)</label>
<input id="air" type="number" step="0.01" placeholder="e.g. 2.50">
<label>Weight in Water (g)</label>
<input id="water" type="number" step="0.01" placeholder="e.g. 1.79">
<button onclick="calc()">Calculate Gem SG</button>
<div id="res" class="result"></div>
</div>
<script>
function calc(){
  let air=parseFloat(document.getElementById('air').value);
  let water=parseFloat(document.getElementById('water').value);
  let box=document.getElementById('res');
  if(!air||!water||air<=water){ box.style.display='block'; box.innerHTML='Please enter correct weights sir. Air must be more than Water.'; return; }
  let sg = air / (air - water);
  let msg = `<b>Gem SG = ${sg.toFixed(2)}</b><br><br>`;
  if(sg>3.45 && sg<3.60) msg += '✅ Likely DIAMOND (3.52)';
  else if(sg>3.15 && sg<3.30) msg += '⚠️ Likely MOISSANITE (3.22)';
  else if(sg>5.4) msg += '⚠️ Likely CUBIC ZIRCONIA (5.6-6.0)';
  else msg += 'Check stone - SG does not match diamond.';
  box.style.display='block'; box.innerHTML=msg;
}
</script>
</body>
</html>
